<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f2f4f7;
  }
  .login-card {
    background: #ffffff;
    padding: 2.5rem;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    width: 100%;
    max-width: 360px;
  }
  .login-card h1 {
    margin: 0 0 1.5rem;
    font-size: 1.5rem;
    text-align: center;
    color: #1a1a1a;
  }
  .field {
    margin-bottom: 1.25rem;
  }
  .field label {
    display: block;
    margin-bottom: 0.4rem;
    font-size: 0.875rem;
    color: #333;
  }
  .field input {
    width: 100%;
    padding: 0.65rem 0.75rem;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    font-size: 1rem;
  }
  .field input:focus {
    outline: none;
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }
  .options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    font-size: 0.85rem;
  }
  .options a {
    color: #4f46e5;
    text-decoration: none;
  }
  button.submit {
    width: 100%;
    padding: 0.75rem;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  button.submit:hover {
    background: #4338ca;
  }
  .signup {
    margin-top: 1.25rem;
    text-align: center;
    font-size: 0.85rem;
    color: #555;
  }
  .signup a {
    color: #4f46e5;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="login-card">
    <h1>Sign in</h1>
    <form id="loginForm">
      <div class="field">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="options">
        <label><input type="checkbox" id="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button type="submit" class="submit">Log In</button>
    </form>
    <div class="signup">
      Don't have an account? <a href="#">Sign up</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('Login submitted (demo only, no backend connected).');
    });
  </script>
</body>
</html>
